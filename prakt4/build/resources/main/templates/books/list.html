<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="fragments/layout :: layout(~{::section})">
<head>
	<title>Книги - Библиотека знаний</title>
</head>
<section>
	<div class="card">
		<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
			<h1>📚 Каталог книг</h1>
			<div sec:authorize="hasAnyRole('MANAGER','ADMIN')">
				<a class="button success" th:href="@{/books/new}">
					➕ Добавить новую книгу
				</a>
			</div>
		</div>
		
		<div th:if="${books != null and !books.empty}" class="glass-effect" style="border-radius: 15px; overflow: hidden;">
			<table>
				<thead>
					<tr>
						<th>📖 Название</th>
						<th>✍️ Автор</th>
						<th>🏷️ Категория</th>
						<th sec:authorize="hasRole('ADMIN')">⚙️ Действия</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="b : ${books}">
						<td>
							<strong th:text="${b.title}">Название</strong>
						</td>
						<td th:text="${b.author.name}">Автор</td>
						<td>
							<span class="role-badge" style="font-size: 0.75rem; padding: 4px 8px;" th:text="${b.category.title}">Категория</span>
						</td>
						<td sec:authorize="hasRole('ADMIN')" style="white-space: nowrap;">
							<a th:href="@{|/books/${b.id}/edit|}" class="button" style="padding: 8px 12px; margin-right: 8px; font-size: 14px;">
								✏️ Редактировать
							</a>
							<form th:action="@{|/books/${b.id}/delete|}" method="post" style="display:inline;">
								<button class="button secondary" type="submit" style="padding: 8px 12px; font-size: 14px;" 
								        onclick="return confirm('Вы уверены, что хотите удалить эту книгу?')">
									🗑️ Удалить
								</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
		
		<div th:if="${books == null or books.empty}" class="glass-effect" style="text-align: center; padding: 40px; border-radius: 15px;">
			<h3>📚 Библиотека пуста</h3>
			<p class="note">В библиотеке пока нет книг</p>
			<div sec:authorize="hasAnyRole('MANAGER','ADMIN')" style="margin-top: 20px;">
				<a class="button success" th:href="@{/books/new}">➕ Добавить первую книгу</a>
			</div>
		</div>
		
		<div style="margin-top: 30px; text-align: center;">
			<a th:href="@{/home}" class="button">🏠 Вернуться на главную</a>
		</div>
	</div>
</section>
</html>

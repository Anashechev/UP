<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="fragments/layout :: layout(~{::section})">
<head>
	<title>Справочники - Библиотека знаний</title>
</head>
<section>
	<div class="card">
		<div style="text-align: center; margin-bottom: 30px;">
			<h1>📋 Справочники</h1>
			<p class="note">Управление авторами и категориями библиотеки</p>
		</div>
		
		<div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap:30px;">
			<!-- Авторы -->
			<div class="glass-effect" style="padding: 25px; border-radius: 15px;">
				<h2 style="color: #4facfe; margin-bottom: 20px;">✍️ Авторы</h2>
				
				<div th:if="${authors != null and !authors.empty}" style="margin-bottom: 25px;">
					<div th:each="a : ${authors}" style="display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 8px;">
						<span style="font-weight: 500;" th:text="${a.name}">Автор</span>
						<form sec:authorize="hasRole('ADMIN')" th:action="@{|/meta/authors/${a.id}/delete|}" method="post" style="display:inline;">
							<button class="button secondary" type="submit" style="padding: 6px 12px; font-size: 12px;" 
							        onclick="return confirm('Удалить автора?')">
								🗑️
							</button>
						</form>
					</div>
				</div>
				
				<div th:if="${authors == null or authors.empty}" style="text-align: center; padding: 20px; color: var(--text-muted);">
					<p>Авторы не найдены</p>
				</div>
				
				<div sec:authorize="hasRole('ADMIN')" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
					<h3 style="margin-bottom: 15px;">➕ Добавить автора</h3>
					<form th:action="@{/meta/authors}" method="post">
						<div class="field">
							<label>👤 Имя автора</label>
							<input type="text" name="name" placeholder="Введите имя автора" required />
						</div>
						<button class="button success" type="submit" style="width: 100%;">Добавить автора</button>
					</form>
				</div>
			</div>
			
			<!-- Категории -->
			<div class="glass-effect" style="padding: 25px; border-radius: 15px;">
				<h2 style="color: #43e97b; margin-bottom: 20px;">🏷️ Категории</h2>
				
				<div th:if="${categories != null and !categories.empty}" style="margin-bottom: 25px;">
					<div th:each="c : ${categories}" style="display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 8px;">
						<span style="font-weight: 500;" th:text="${c.title}">Категория</span>
						<form sec:authorize="hasRole('ADMIN')" th:action="@{|/meta/categories/${c.id}/delete|}" method="post" style="display:inline;">
							<button class="button secondary" type="submit" style="padding: 6px 12px; font-size: 12px;" 
							        onclick="return confirm('Удалить категорию?')">
								🗑️
							</button>
						</form>
					</div>
				</div>
				
				<div th:if="${categories == null or categories.empty}" style="text-align: center; padding: 20px; color: var(--text-muted);">
					<p>Категории не найдены</p>
				</div>
				
				<div sec:authorize="hasRole('ADMIN')" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
					<h3 style="margin-bottom: 15px;">➕ Добавить категорию</h3>
					<form th:action="@{/meta/categories}" method="post">
						<div class="field">
							<label>🏷️ Название категории</label>
							<input type="text" name="title" placeholder="Введите название категории" required />
						</div>
						<button class="button warning" type="submit" style="width: 100%;">Добавить категорию</button>
					</form>
				</div>
			</div>
		</div>
		
		<div style="margin-top: 30px; text-align: center;">
			<a th:href="@{/home}" class="button">🏠 Вернуться на главную</a>
		</div>
	</div>
</section>
</html>

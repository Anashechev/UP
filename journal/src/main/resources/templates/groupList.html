<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Список групп</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .form-group { margin: 10px 0; }
    .form-group input { margin: 5px; padding: 8px; }
    .group-item { border: 1px solid #ccc; margin: 10px 0; padding: 10px; }
    .search-form { background: #f5f5f5; padding: 15px; margin: 10px 0; }
    .add-form { background: #e8f5e8; padding: 15px; margin: 10px 0; }
    button { padding: 8px 15px; margin: 5px; cursor: pointer; }
    .delete-btn { background: #ff6b6b; color: white; border: none; }
    .logical-delete-btn { background: #ffa500; color: white; border: none; }
    .update-btn { background: #4ecdc4; color: white; border: none; }
    .add-btn { background: #45b7d1; color: white; border: none; }
    .nav-link { margin: 10px; text-decoration: none; color: #333; }
  </style>
</head>
<body>
<h1>Список групп</h1>

<div style="margin: 20px 0;">
  <a href="/students" class="nav-link">Студенты</a>
  <a href="/groups" class="nav-link">Группы</a>
  <a href="/subjects" class="nav-link">Предметы</a>
</div>

<div class="search-form">
  <h3>Поиск групп</h3>
  <form action="/groups/search" method="get">
    <input type="text" name="name" placeholder="Введите название группы" 
           th:value="${searchQuery}" style="width: 300px;">
    <button type="submit">Поиск</button>
    <a href="/groups" style="margin-left: 10px;">Показать все</a>
  </form>
</div>

<div class="add-form">
  <h3>Добавить новую группу</h3>
  <form action="/groups/add" method="post">
    <div class="form-group">
      <input type="text" name="name" placeholder="Название группы" required>
      <input type="text" name="description" placeholder="Описание группы" required>
    </div>
    <button type="submit" class="add-btn">Добавить группу</button>
  </form>
</div>

<h2>Список групп:</h2>
<div th:if="${groups != null and !groups.empty}">
  <div th:each="group : ${groups}" class="group-item">
    <h4 th:text="${group.name}"></h4>
    <p><strong>ID:</strong> <span th:text="${group.id}"></span></p>
    <p><strong>Описание:</strong> <span th:text="${group.description}"></span></p>
    <p><strong>Создан:</strong> <span th:text="${#temporals.format(group.createdAt, 'dd.MM.yyyy HH:mm')}"></span></p>
    <p><strong>Обновлен:</strong> <span th:text="${#temporals.format(group.updatedAt, 'dd.MM.yyyy HH:mm')}"></span></p>
    
    <form action="/groups/update" method="post" style="display:inline;">
      <input type="hidden" name="id" th:value="${group.id}"/>
      <input type="text" name="name" th:value="${group.name}" placeholder="Название группы" required/>
      <input type="text" name="description" th:value="${group.description}" placeholder="Описание группы" required/>
      <button type="submit" class="update-btn">Обновить</button>
    </form>
    
    <form action="/groups/logical-delete" method="post" style="display:inline;">
      <input type="hidden" name="id" th:value="${group.id}"/>
      <button type="submit" class="logical-delete-btn" onclick="return confirm('Вы уверены, что хотите скрыть эту группу?')">Скрыть</button>
    </form>
    
    <form action="/groups/delete" method="post" style="display:inline;">
      <input type="hidden" name="id" th:value="${group.id}"/>
      <button type="submit" class="delete-btn" onclick="return confirm('Вы уверены, что хотите полностью удалить эту группу?')">Удалить навсегда</button>
    </form>
  </div>
</div>

<div th:if="${groups == null or groups.empty}">
  <p>Группы не найдены.</p>
</div>

</body>
</html>

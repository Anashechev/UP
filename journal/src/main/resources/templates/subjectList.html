<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Список предметов</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .form-group { margin: 10px 0; }
    .form-group input { margin: 5px; padding: 8px; }
    .subject-item { border: 1px solid #ccc; margin: 10px 0; padding: 10px; }
    .search-form { background: #f5f5f5; padding: 15px; margin: 10px 0; }
    .add-form { background: #e8f5e8; padding: 15px; margin: 10px 0; }
    button { padding: 8px 15px; margin: 5px; cursor: pointer; }
    .delete-btn { background: #ff6b6b; color: white; border: none; }
    .logical-delete-btn { background: #ffa500; color: white; border: none; }
    .update-btn { background: #4ecdc4; color: white; border: none; }
    .add-btn { background: #45b7d1; color: white; border: none; }
    .nav-link { margin: 10px; text-decoration: none; color: #333; }
  </style>
</head>
<body>
<h1>Список предметов</h1>

<div style="margin: 20px 0;">
  <a href="/students" class="nav-link">Студенты</a>
  <a href="/groups" class="nav-link">Группы</a>
  <a href="/subjects" class="nav-link">Предметы</a>
</div>

<div class="search-form">
  <h3>Поиск предметов</h3>
  <form action="/subjects/search" method="get">
    <input type="text" name="name" placeholder="Введите название или код предмета" 
           th:value="${searchQuery}" style="width: 300px;">
    <button type="submit">Поиск</button>
    <a href="/subjects" style="margin-left: 10px;">Показать все</a>
  </form>
</div>

<div class="add-form">
  <h3>Добавить новый предмет</h3>
  <form action="/subjects/add" method="post">
    <div class="form-group">
      <input type="text" name="name" placeholder="Название предмета" required>
      <input type="text" name="code" placeholder="Код предмета" required>
      <input type="number" name="credits" placeholder="Количество кредитов" min="1" max="10" required>
      <input type="text" name="description" placeholder="Описание предмета" required>
    </div>
    <button type="submit" class="add-btn">Добавить предмет</button>
  </form>
</div>

<h2>Список предметов:</h2>
<div th:if="${subjects != null and !subjects.empty}">
  <div th:each="subject : ${subjects}" class="subject-item">
    <h4 th:text="${subject.name}"></h4>
    <p><strong>ID:</strong> <span th:text="${subject.id}"></span></p>
    <p><strong>Код:</strong> <span th:text="${subject.code}"></span></p>
    <p><strong>Кредиты:</strong> <span th:text="${subject.credits}"></span></p>
    <p><strong>Описание:</strong> <span th:text="${subject.description}"></span></p>
    <p><strong>Создан:</strong> <span th:text="${#temporals.format(subject.createdAt, 'dd.MM.yyyy HH:mm')}"></span></p>
    <p><strong>Обновлен:</strong> <span th:text="${#temporals.format(subject.updatedAt, 'dd.MM.yyyy HH:mm')}"></span></p>
    
    <form action="/subjects/update" method="post" style="display:inline;">
      <input type="hidden" name="id" th:value="${subject.id}"/>
      <input type="text" name="name" th:value="${subject.name}" placeholder="Название предмета" required/>
      <input type="text" name="code" th:value="${subject.code}" placeholder="Код предмета" required/>
      <input type="number" name="credits" th:value="${subject.credits}" placeholder="Кредиты" min="1" max="10" required/>
      <input type="text" name="description" th:value="${subject.description}" placeholder="Описание предмета" required/>
      <button type="submit" class="update-btn">Обновить</button>
    </form>
    
    <form action="/subjects/logical-delete" method="post" style="display:inline;">
      <input type="hidden" name="id" th:value="${subject.id}"/>
      <button type="submit" class="logical-delete-btn" onclick="return confirm('Вы уверены, что хотите скрыть этот предмет?')">Скрыть</button>
    </form>
    
    <form action="/subjects/delete" method="post" style="display:inline;">
      <input type="hidden" name="id" th:value="${subject.id}"/>
      <button type="submit" class="delete-btn" onclick="return confirm('Вы уверены, что хотите полностью удалить этот предмет?')">Удалить навсегда</button>
    </form>
  </div>
</div>

<div th:if="${subjects == null or subjects.empty}">
  <p>Предметы не найдены.</p>
</div>

</body>
</html>
